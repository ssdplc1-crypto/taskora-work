<script>
(function () {
  const installButtons = document.querySelectorAll("[data-install-app]");
  let deferredInstallPrompt = null;

  function showInstallButton() {
    installButtons.forEach(button => {
      button.hidden = false;
    });
  }

  function hideInstallButton() {
    installButtons.forEach(button => {
      button.hidden = true;
    });
  }

  // Register Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/static/sw.js", {
        scope: "/"
      }).catch(function (error) {
        console.error("TASKORA Service Worker:", error);
      });
    });
  }

  // Android / Chrome install prompt
  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredInstallPrompt = event;

    showInstallButton();

    console.log("TASKORA install prompt ready.");
  });

  // Install button
  installButtons.forEach(function (button) {
    button.addEventListener("click", async function () {
      if (!deferredInstallPrompt) {
        alert(
          "Install option is not ready yet. Please wait a moment and try again."
        );
        return;
      }

      try {
        deferredInstallPrompt.prompt();

        const result = await deferredInstallPrompt.userChoice;

        console.log(
          "TASKORA install result:",
          result.outcome
        );

        if (result.outcome === "accepted") {
          hideInstallButton();
        }

        deferredInstallPrompt = null;

      } catch (error) {
        console.error("TASKORA install error:", error);
      }
    });
  });

  // Hide button after successful installation
  window.addEventListener("appinstalled", function () {
    deferredInstallPrompt = null;
    hideInstallButton();

    console.log("TASKORA WORK installed successfully.");
  });

  // Splash screen
  const splash = document.getElementById("taskora-splash");

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const seenKey = "taskora_splash_seen_v1";

  function hideSplash() {
    if (!splash) return;

    splash.classList.add("splash-hide");

    setTimeout(function () {
      if (splash) {
        splash.remove();
      }
    }, 650);
  }

  if (splash) {
    try {
      if (sessionStorage.getItem(seenKey) === "1") {
        hideSplash();
      } else {
        sessionStorage.setItem(seenKey, "1");

        setTimeout(
          hideSplash,
          isStandalone ? 1850 : 1650
        );
      }
    } catch (error) {
      setTimeout(hideSplash, 1650);
    }
  }

})();
                          </script>
