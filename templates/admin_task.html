{% extends "base.html" %}
{% block title %}Create Task · TASKORA WORK{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <span class="eyebrow">ADMIN</span>
    <h1>Create Task</h1>
    <p>Publish a verified task for workers to complete.</p>
  </div>
  <a class="btn ghost" href="{{ url_for('admin_tasks') }}">Back to Tasks</a>
</div>

<div class="card create-task-card">
  <form method="post" action="{{ url_for('admin_new_task') }}" autocomplete="off">
    <label>Task title
      <input name="title" value="{{ request.form.get('title','') }}" required maxlength="160" placeholder="e.g. Follow our TikTok page">
    </label>

    <label>Platform / Category
      <select name="category" required>
        <option value="">Select category</option>
        {% for c in ['TikTok','Facebook','Instagram','YouTube','X','Telegram','WhatsApp','Other'] %}
        <option value="{{ c }}" {% if request.form.get('category') == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>

    <label>Task link
      <input type="url" name="task_link" value="{{ request.form.get('task_link','') }}" required maxlength="1000" placeholder="https://...">
    </label>

    <label>Description / Instructions
      <textarea name="description" rows="5" required maxlength="5000" placeholder="Tell workers exactly what they must do and what proof they should submit.">{{ request.form.get('description','') }}</textarea>
    </label>

    <div class="task-form-grid">
      <label>Reward (₦)
        <input type="number" name="reward" min="1" step="1" value="{{ request.form.get('reward','') }}" required>
      </label>
      <label>Slots
        <input type="number" name="slots" min="1" step="1" value="{{ request.form.get('slots','1') }}" required>
      </label>
    </div>

    <div class="task-form-grid">
      <label>Deadline (optional)
        <input type="datetime-local" name="deadline" value="{{ request.form.get('deadline','') }}">
      </label>
      <label>Difficulty
        <select name="difficulty">
          {% for d in ['Beginner','Intermediate','Advanced'] %}
          <option value="{{ d }}" {% if request.form.get('difficulty','Beginner') == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <button class="btn full create-task-button" type="submit">Create Task</button>
  </form>
</div>

<style>
.create-task-card{max-width:760px;margin:0 auto;padding:20px}
.task-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.create-task-button{margin-top:8px;min-height:44px}
@media(max-width:600px){.task-form-grid{grid-template-columns:1fr}.create-task-card{padding:15px}}
</style>
{% endblock %}
