{% extends "base.html" %}

{% block title %}Create Task — TASKORA WORK{% endblock %}

{% block content %}

<div class="page-head">
    <div>
        <span class="eyebrow">ADMIN</span>
        <h1>Create Task</h1>
        <p>Create a task and provide the platform link users must visit.</p>
    </div>
</div>

<div class="form-card">

    <form method="post">

        <label>
            Task title

            <input
                type="text"
                name="title"
                required
                placeholder="e.g. Subscribe to TASKORA WORK on YouTube"
            >
        </label>

        <label>
            Platform / Category

            <select name="category" required>
                <option value="">Select platform</option>
                <option value="YouTube">YouTube</option>
                <option value="TikTok">TikTok</option>
                <option value="Facebook">Facebook</option>
                <option value="X">X</option>
                <option value="Instagram">Instagram</option>
                <option value="Telegram">Telegram</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Website">Website</option>
                <option value="Other">Other</option>
            </select>
        </label>

        <label>
            Task link

            <input
                type="url"
                name="task_link"
                required
                placeholder="https://youtube.com/@taskora_work"
            >

            <small>
                This is the link users will open to complete the task.
            </small>
        </label>

        <label>
            Task description

            <textarea
                name="description"
                rows="6"
                required
                placeholder="Explain exactly what the user needs to do."
            ></textarea>
        </label>

        <div class="grid two">

            <label>
                Reward (₦)

                <input
                    type="number"
                    name="reward"
                    min="1"
                    required
                    placeholder="50"
                >
            </label>

            <label>
                Slots

                <input
                    type="number"
                    name="slots"
                    min="1"
                    value="100"
                    required
                >
            </label>

        </div>

        <label>
            Difficulty

            <select name="difficulty">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </label>

        <label>
            Deadline

            <input
                type="datetime-local"
                name="deadline"
            >
        </label>

        <button class="btn full" type="submit">
            Create Task
        </button>

    </form>

</div>

{% endblock %}
