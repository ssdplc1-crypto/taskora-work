{% extends "base.html" %}{% block title %}Admin Tasks — TASKORA WORK{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMIN · TASKS</span><h1>Tasks</h1></div><a class="btn" href="{{ url_for('admin_new_task') }}">Create Task</a></div><div class="table-wrap"><table><tr><th>Title</th><th>Reward</th><th>Status</th><th>Submissions</th><th>Action</th></tr>{% for t in tasks %}<tr><td>{{t.title}}</td><td>₦{{"{:,}".format(t.reward)}}</td><td>{{t.status}}</td><td>{{t.submission_count or 0}}</td><td><form method="post" action="{{url_for('admin_delete_task',task_id=t.id)}}"><button class="btn danger small">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
