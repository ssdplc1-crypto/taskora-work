{% extends "base.html" %}
{% block title %}Register — TASKORA WORK{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-copy"><span class="eyebrow">JOIN TASKORA</span><h1>Start your work journey.</h1><p>Registration is free. Worker activation is ₦3,000 after you review the platform.</p></div>
  <form class="form-card" method="post">
    <h2>Create account</h2>
    <label>Full name<input name="full_name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Phone number<input name="phone" required></label>
    <label>Password<input type="password" name="password" minlength="8" required></label>
    <button class="btn full" type="submit">Create account</button>
    <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </form>
</div>
{% endblock %}
